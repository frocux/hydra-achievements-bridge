; Образец: CreamAPI. Раздел [achievements], где «1» — открыто, «0» — нет,
; а время открытия лежит отдельным ключом unlocktime.
; Если время записано коротким числом (7 цифр вместо 10) — это просто
; потерянные нули на конце, мост их досчитывает. Здесь число полное.

[achievements]
ACH_CREAM_ONE=1
ACH_CREAM_TWO=0
unlocktime=1700000000
